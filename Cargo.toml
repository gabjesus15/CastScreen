[workspace]
resolver = "2"
members = [
    "crates/castscreen-core",
    "crates/castscreen-capture",
    "crates/castscreen-encoder",
    "crates/castscreen-network",
    "crates/castscreen-receiver",
    "crates/castscreen-sender",
    "crates/castscreen-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["gabjesus15", "CastScreen Contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/gabjesus15/CastScreen"

[workspace.dependencies]
# Internal crates
castscreen-core = { path = "crates/castscreen-core" }
castscreen-capture = { path = "crates/castscreen-capture" }
castscreen-encoder = { path = "crates/castscreen-encoder" }
castscreen-network = { path = "crates/castscreen-network" }

# Concurrency & Channels
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio = { version = "1.38", features = ["full"] }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Windows Native APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
